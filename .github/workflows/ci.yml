name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: [self-hosted, linux, x64, onetree-ci]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Require repository-owned pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo '::error::This local runner accepts pull requests from this repository only.'
          exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Lint
        run: ruff check src tests
      - name: Types
        run: mypy
      - name: Tests + coverage gate
        run: pytest
