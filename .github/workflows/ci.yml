name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: [self-hosted, linux, x64, onetree-ci]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Require repository-owned pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo '::error::This local runner accepts pull requests from this repository only.'
          exit 1
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"
          enable-cache: false
      - name: Require HOME and an absolute PATH on the runner
        # Measured 2026-09-10 (run 34425990890): with HOME unset, setup-uv prepends
        # "undefined/.local/bin" to PATH, a cwd-relative entry a checked-out file
        # could satisfy before /usr/bin/git. An empty entry is the cwd as well,
        # and `read -a` drops a trailing one (Round BF DUO, 2026-09-10), so empty
        # entries are refused on the joined string first. Refuse that environment
        # instead of running the gates inside it.
        run: |
          if [ -z "${HOME:-}" ]; then
            echo '::error::HOME is unset on this runner.'
            exit 1
          fi
          case ":${PATH}:" in
            *::*)
              echo '::error::PATH carries an empty entry (a leading, doubled or trailing colon).'
              exit 1 ;;
          esac
          IFS=: read -r -a entries <<< "$PATH"
          for entry in "${entries[@]}"; do
            case "$entry" in
              /*) ;;
              *) echo "::error::PATH carries a relative entry '$entry'."; exit 1 ;;
            esac
          done
      - name: Prepare standalone Python
        env:
          UV_PYTHON_INSTALL_DIR: ${{ runner.tool_cache }}/uv-python
        run: |
          uv venv --managed-python --python '${{ matrix.python-version }}' --seed .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          env -i PATH=/usr/bin:/bin .venv/bin/python -I -S --version
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Lint
        run: ruff check src tests
      - name: Types
        run: mypy
      - name: Tests + coverage gate
        run: pytest
