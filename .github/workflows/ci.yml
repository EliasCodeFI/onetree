name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: [self-hosted, linux, x64, onetree-ci]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Require repository-owned pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo '::error::This local runner accepts pull requests from this repository only.'
          exit 1
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"
          enable-cache: false
      - name: Prepare standalone Python
        env:
          UV_PYTHON_INSTALL_DIR: ${{ runner.tool_cache }}/uv-python
        run: |
          uv venv --managed-python --python '${{ matrix.python-version }}' --seed .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          env -i PATH=/usr/bin:/bin .venv/bin/python -I -S --version
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Lint
        run: ruff check src tests
      - name: Types
        run: mypy
      - name: Tests + coverage gate
        run: pytest
